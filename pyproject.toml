[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-guard"
version = "0.8.0"
description = "Quét file nén (ZIP, RAR, 7z, TAR, GZ…) tìm dấu hiệu trojan, keylogger, worm, ransomware"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "py7zr>=1.0",
    "rarfile>=4.1",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3"]
dev = ["pytest>=7"]

[project.scripts]
archiveguard = "archive_guard.cli:main"

[tool.setuptools.packages.find]
include = ["archive_guard*"]

[tool.setuptools.package-data]
archive_guard = ["data/*.txt", "data/rules/*.yar"]

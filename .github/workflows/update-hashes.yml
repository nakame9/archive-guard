name: update-hashes

# Tải mã băm mã độc mới từ MalwareBazaar hằng ngày, ký file bằng Sigstore và đăng lên GitHub Release "hash-db" →
# admin cập nhật tại chỗ bằng `archiveguard --update-db` (xác minh chữ ký, không cần Auth-Key).
# Không commit vào main: gốc của mỗi lượt là bản đã ký gần nhất trên Release, archive_guard/data/malwarebazaar.txt
# chỉ là bản chụp đi kèm gói.
# Cần secret ABUSECH_AUTH_KEY: Settings → Secrets and variables → Actions → New repository secret.
on:
  schedule:
    - cron: "17 1 * * *"  # 08:17 giờ Việt Nam (recent_detections phủ 7 ngày gần nhất)
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-hashes   # các lượt nối tiếp nhau: không lượt nào ghi đè Release bằng dữ liệu cũ hơn
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'  # danh tính chữ ký mà --update-db chấp nhận gắn với nhánh main
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Release hash-db
      id-token: write  # chữ ký Sigstore keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt && python -m pip install --no-deps -e .
      - name: Lấy bản đã ký gần nhất từ Release hash-db làm gốc (tải/xác minh lỗi → dừng, không đăng gì)
        run: python -c "from archive_guard import malwarebazaar as mb; print(mb.download_db('seed/malwarebazaar.txt'), 'mã băm')"
      - name: Tải mã băm (gộp vào danh sách cũ, bỏ mã cũ hơn 12 tháng)
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          mkdir dist
          python -c "import os; from archive_guard import malwarebazaar as mb; mb.update(os.environ['ABUSECH_AUTH_KEY'], 'dist/malwarebazaar.txt', seed=['seed/malwarebazaar.txt'])"
      - name: Ký bằng Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/malwarebazaar.txt
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/update-hashes.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Đăng lên GitHub Release "hash-db"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hash-db --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create hash-db \
            --repo "$GITHUB_REPOSITORY" --target main --prerelease --title "Danh sách mã băm (cập nhật hằng ngày)" \
            --notes "Dùng: archiveguard --update-db (xác minh chữ ký Sigstore của workflow update-hashes.yml)."
          gh release upload hash-db dist/malwarebazaar.txt dist/malwarebazaar.txt.sigstore.json \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Tự kiểm tra như admin (tải về + xác minh chữ ký)
        run: archiveguard --update-db

name: release

# Phát hành khi đẩy tag vX.Y.Z (tag nên được ký: git tag -s, xem SECURITY.md):
#   1. build sdist + wheel bằng công cụ pin theo hash (.github/requirements-tools.txt)
#   2. SBOM CycloneDX của môi trường cài đặt thật (dependency lấy từ requirements.txt có hash)
#   3. provenance SLSA ký bằng Sigstore (gh attestation verify) + chữ ký Sigstore cho từng file (.sigstore.json)
#   4. PyPI bằng Trusted Publishing (không có token lưu trong repo) kèm attestation PEP 740
#   5. GitHub Release đính kèm dist, SBOM, chữ ký
# workflow_dispatch: chạy thử bước 1–3 (không phát hành gì).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  push:  # TẠM: chạy thử trên nhánh này
    branches: [tmp/supply-chain]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r .github/requirements-tools.txt
      - name: Tag phải khớp phiên bản trong pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME ≠ v$version"; exit 1; }
      - name: Build
        run: |
          # dấu thời gian trong file nén = thời điểm commit: build lại cùng commit ra cùng mã băm
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
      - name: SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom
          /tmp/sbom/bin/pip install --require-hashes -r requirements.txt
          /tmp/sbom/bin/pip install --no-deps dist/*.whl
          /tmp/sbom/bin/python -m pip uninstall -y pip  # pip của venv không phải dependency của ArchiveGuard
          cyclonedx-py environment /tmp/sbom/bin/python --pyproject pyproject.toml --mc-type application \
            --of JSON --output-reproducible -o "dist/archive_guard-${GITHUB_REF_NAME#v}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # chứng chỉ Sigstore ngắn hạn gắn với danh tính workflow này
      attestations: write  # lưu provenance vào GitHub
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Provenance SLSA (gh attestation verify <file> --repo nakame9/archive-guard)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Chữ ký Sigstore cho từng file (python -m sigstore verify github …)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: sign
    runs-on: ubuntu-latest
    environment: pypi  # Trusted Publisher trên pypi.org phải khai báo đúng repo + release.yml + môi trường này
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: rm -f dist/*.cdx.json  # PyPI chỉ nhận sdist/wheel
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true  # PEP 740: PyPI lưu attestation Sigstore gắn với workflow này

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist/
      - run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Tạo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --verify-tag --notes "Xem CHANGELOG.md. Cách xác minh chữ ký, provenance và SBOM: SECURITY.md."

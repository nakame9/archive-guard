name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "41 0 * * *"  # hằng ngày: CVE mới được công bố mà code không đổi vẫn phải bị phát hiện

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check --output-format=github .

  audit:
    # Lỗ hổng đã công bố (PyPI Advisory DB / OSV) trong MỌI dependency đã pin, kể cả công cụ release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: pip-audit --disable-pip --require-hashes --strict -r requirements-dev.txt
      - run: pip-audit --disable-pip --require-hashes --strict -r .github/requirements-tools.txt
      - name: Lock file khớp pyproject.toml (đổi dependency mà quên chạy lại uv pip compile)
        run: |
          python -m pip install --require-hashes -r .github/requirements-tools.txt
          # -o vào bản sao của lock hiện có: uv giữ nguyên các phiên bản đã pin, chỉ đổi khi pyproject.toml đòi
          cp requirements.txt /tmp/r.txt && cp requirements-dev.txt /tmp/rd.txt
          uv pip compile pyproject.toml --extra yara --universal --python-version 3.10 --generate-hashes -q -o /tmp/r.txt
          uv pip compile pyproject.toml --extra yara --extra dev --universal --python-version 3.10 --generate-hashes -q -o /tmp/rd.txt
          diff <(grep -E "^[a-z]" requirements.txt) <(grep -E "^[a-z]" /tmp/r.txt)
          diff <(grep -E "^[a-z]" requirements-dev.txt) <(grep -E "^[a-z]" /tmp/rd.txt)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          # arm64: seccomp chưa hỗ trợ → test kiểm tra trạng thái sandbox không bị báo quá mức thực tế
          - os: ubuntu-24.04-arm
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - name: Cài unrar (test RAR với file thật trong tests/data, không được bỏ qua trên Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unrar || {
            sudo add-apt-repository -y multiverse && sudo apt-get update -q && sudo apt-get install -y -q unrar; }
      # pytest-github-actions-annotate-failures (trong requirements-dev.txt): test thất bại hiện thành annotation
      - run: pytest -q

  sandbox-report:
    # In trạng thái từng lớp sandbox trên mỗi hệ điều hành thành annotation (xem được không cần đăng nhập)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m archive_guard.sandbox

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --no-cache -t archive-guard .
      - name: Tạo mẫu thử vô hại
        run: |
          mkdir ci-samples
          python3 -c "import zipfile; z = zipfile.ZipFile('ci-samples/hoadon.zip', 'w'); z.writestr('hoadon.pdf.exe', b'MZ' + bytes(64)); z.close()"
      - name: Quét trong container cứng hóa (phải ra ĐÁNG NGỜ, mã thoát 1)
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=256m --cap-drop ALL \
            --security-opt no-new-privileges --memory 1g --pids-limit 128 \
            -v "$PWD/ci-samples:/scan:ro" archive-guard . --no-clamav
          code=$?
          echo "mã thoát: $code"
          test "$code" -eq 1
      - name: unrar trong image đọc được RAR có mật khẩu (phải ra SẠCH, mã thoát 0)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m --cap-drop ALL \
            --security-opt no-new-privileges -v "$PWD/tests/data:/scan:ro" archive-guard rar5-psw.rar -p password --no-clamav
      - name: Trạng thái sandbox bên trong container
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m --cap-drop ALL \
            --security-opt no-new-privileges -e GITHUB_ACTIONS -e AG_CONTEXT=docker \
            --entrypoint python archive-guard -m archive_guard.sandbox

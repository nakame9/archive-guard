name: resolve-pins
on:
  push:
    branches: [tmp/resolve-pins]
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ts in 20261101T000000Z 20261102T000000Z; do for a in amd64 arm64; do
            url=https://snapshot.debian.org/archive/debian/$ts/pool/non-free/u/unrar-nonfree/unrar_7.1.8-1_$a.deb
            sum=$(curl -fsSL --retry 3 "$url" | sha256sum | cut -c1-64) && echo "::notice title=snapshot::$url $sum"
          done; done
          curl -fsSL "https://snapshot.debian.org/mr/binary/unrar/" | head -c 600; echo

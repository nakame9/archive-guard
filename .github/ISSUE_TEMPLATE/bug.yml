name: Lỗi
description: ArchiveGuard chạy sai, crash, hoặc kết quả không như tài liệu mô tả
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ **Không đính kèm mã độc thật**, kể cả dạng nén có mật khẩu. Hãy ghi mã SHA-256 hoặc cách tạo file để tái hiện."
  - type: input
    id: version
    attributes:
      label: Phiên bản
      description: Kết quả của `archiveguard -V`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Hệ điều hành và phiên bản Python
      placeholder: Windows 11, Python 3.13
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Lệnh đã chạy
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả nhận được
      description: Dán phần output hoặc báo cáo JSON liên quan
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
